<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFL Survivor</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #f4f7fb;
      --muted: #9aa8b5;
      --accent: #3dd68c;
      --warn: #f5c542;
      --chip: #243140;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    main { max-width: 42rem; margin: 0 auto; padding: 0.85rem 1rem 2.5rem; }
    h1 { font-size: 0.95rem; font-weight: 650; margin: 0; color: var(--text); }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem 0.7rem;
      margin: 0 0 0.7rem;
      font-size: 0.86rem;
      color: var(--muted);
    }
    .bar h1 { margin-right: 0.15rem; }
    .bar .sep { color: #3a4a5a; }
    .kv { color: var(--text); font-variant-numeric: tabular-nums; }
    .lives {
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      color: var(--text);
    }
    .life-dots { display: inline-flex; gap: 0.18rem; }
    .life-dots i {
      width: 0.38rem;
      height: 0.38rem;
      border-radius: 50%;
      background: var(--accent);
      display: block;
    }
    .life-dots i.off { background: #3a4a5a; }
    .used {
      margin-top: 1rem;
    }
    .used-k { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 0.28rem; margin-top: 0.3rem; }
    .chip {
      background: var(--chip);
      border-radius: 999px;
      padding: 0.08rem 0.5rem;
      font-size: 0.75rem;
      color: var(--text);
    }
    .used-empty { color: var(--muted); font-size: 0.86rem; }
    .pick {
      background: var(--card);
      border-radius: 0.85rem;
      padding: 0.85rem 1rem 1rem;
      margin-bottom: 0.85rem;
    }
    .pick .label { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .pick h2 { font-size: 1.55rem; margin: 0.05rem 0 0.15rem; line-height: 1.15; }
    .meta { color: var(--muted); font-size: 0.86rem; }
    .nums {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.15rem 1.15rem;
      margin-top: 0.55rem;
    }
    .nums span { color: var(--muted); font-size: 0.72rem; margin-right: 0.28rem; }
    .nums strong { font-size: 1.05rem; color: var(--accent); font-variant-numeric: tabular-nums; }
    .nums .sub { color: var(--muted); font-size: 0.8rem; }
    .summary { margin-top: 0.65rem; font-size: 0.88rem; }
    .summary ul { padding-left: 1.05rem; margin: 0; }
    .summary li { margin: 0.22rem 0; }
    .cta {
      display: block;
      margin-top: 0.75rem;
      background: var(--accent);
      color: #062214;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      padding: 0.7rem;
      border-radius: 0.6rem;
    }
    h3 { margin: 0.9rem 0 0.35rem; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    ol, ul { padding-left: 1.2rem; margin: 0; }
    li { margin: 0.35rem 0; }
    .glossary { margin-top: 1.25rem; font-size: 0.8rem; color: var(--muted); }
    .glossary dt { color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .glossary dd { margin: 0 0 0.45rem; }
    .stamp { margin-top: 1.5rem; color: var(--muted); font-size: 0.8rem; }
    .error { color: #ff8d8d; }
  </style>
</head>
<body>
  <main>
    <div id="app">Loading…</div>
  </main>
  <script>
    function pct(v) {
      if (v == null) return "—";
      return Number(v).toFixed(2);
    }
    function american(ml) {
      if (ml == null) return "—";
      const n = Number(ml);
      return n > 0 ? "+" + n : String(n);
    }
    function lineHint(row) {
      if (!row || row.ml == null) return "";
      const src = row.line_source === "pinnacle" ? "Pinnacle" : "fair";
      return src + " " + american(row.ml);
    }
    fetch("./recommendations.json", { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("missing recommendations.json");
        return r.json();
      })
      .then((d) => {
        const usedList = d.used_teams || [];
        const usedChips = usedList.length
          ? `<div class="chips">${usedList.map((t) => `<span class="chip">${t}</span>`).join("")}</div>`
          : `<div class="used-empty">none</div>`;
        const livesMax = Math.max(2, Number(d.lives_remaining) || 0);
        const lives = Number(d.lives_remaining) || 0;
        const lifeDots = Array.from({ length: livesMax }, (_, i) =>
          `<i class="${i < lives ? "" : "off"}"></i>`
        ).join("");
        const p = d.primary;
        const locked = d.committed_this_week ? ` · locked ${d.committed_this_week}` : "";
        const points = Array.isArray(d.executive_summary)
          ? d.executive_summary
          : (d.executive_summary ? [d.executive_summary] : []);
        const summary = points.length
          ? `<div class="summary"><ul>${points.map((s) => `<li>${s}</li>`).join("")}</ul></div>`
          : "";
        let pickBlock = `<div class="pick"><div class="label">No recommend</div><h2>${d.status}</h2>${summary}</div>`;
        if (p && d.status !== "eliminated") {
          pickBlock = `
            <div class="pick">
              <div class="label">This week’s pick${p.locked ? " · locked" : ""}</div>
              <h2>${p.team}</h2>
              <div class="meta">vs ${p.opponent}${p.is_home ? " (home)" : " (away)"} · ${p.kickoff}${locked}</div>
              <div class="nums">
                <div><span>p_final</span><strong>${pct(p.p_final)}</strong></div>
                <div><span>survive_p</span><strong>${pct(p.survive_p)}</strong></div>
                ${p.ml == null ? "" : `<div class="sub">${lineHint(p)}</div>`}
              </div>
              ${summary}
              ${d.record_pick_url ? `<a class="cta" href="${d.record_pick_url}">Record pick</a>` : ""}
            </div>`;
        }
        const alts = (d.alternatives || []).map((a) =>
          `<li>${a.team} · survive_p ${pct(a.survive_p)} · p_final ${pct(a.p_final)}${a.ml == null ? "" : " · " + lineHint(a)}</li>`
        ).join("");
        const path = (d.projected_path || []).map((s) => {
          const line = s.ml == null ? "" : " · " + lineHint(s);
          return `<li>W${s.week} ${s.team || "(starve)"} · p_final ${pct(s.p_win)} · ${s.source}${line}</li>`;
        }).join("");
        document.getElementById("app").innerHTML = `
          <header class="bar">
            <h1>NFL Survivor</h1>
            <span class="sep">·</span>
            <span class="kv">W${d.week}</span>
            <span class="sep">·</span>
            <span class="lives"><span class="life-dots" aria-hidden="true">${lifeDots}</span>${lives} ${lives === 1 ? "life" : "lives"}</span>
          </header>
          ${pickBlock}
          <h3>Alternatives</h3>
          <ol>${alts || "<li>None</li>"}</ol>
          <h3>Projected path</h3>
          <ol>${path || "<li>None</li>"}</ol>
          <section class="used">
            <h3>Used teams</h3>
            ${usedChips}
          </section>
          <dl class="glossary">
            <dt>p_final</dt><dd>this-week win % (Pinnacle, no-vig)</dd>
            <dt>survive_p / survive</dt><dd>chance you finish the season alive</dd>
            <dt>week</dt><dd>NFL week of this slate</dd>
            <dt>market</dt><dd>priced from a Pinnacle moneyline</dd>
            <dt>prior</dt><dd>no line yet; 58% home / 42% away</dd>
          </dl>
          <div class="stamp">generated_at ${d.generated_at || ""}</div>
        `;
      })
      .catch((err) => {
        document.getElementById("app").innerHTML = `<p class="error">${err.message}</p>`;
      });
  </script>
</body>
</html>
